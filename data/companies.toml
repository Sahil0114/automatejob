# Normalized companies registry.
#
# Every company row records: name, website, careers URL, ATS type, Mumbai
# office status, remote hiring eligibility, last-checked date, and the source
# of each claim. Facts marked `null` / "unknown" / "" are UNVERIFIED — we do
# not guess.
#
# The three Ashby boards were verified against the live public API on
# 2026-11-09; their location/eligibility facts were read from the returned
# postings (e.g. Kong lists "Staff Solutions Engineer- Mumbai, Mumbai, India";
# Supabase lists 40 "Remote, Global" roles). The Greenhouse/Lever companies
# ship with only structural facts (ATS type + board URL) filled in — their
# Mumbai-office and remote-eligibility fields remain unverified until checked.

[[companies]]
name = "Kong"
website = "https://konghq.com"
careers_url = "https://jobs.ashbyhq.com/kong"
ats_type = "ashby"
mumbai_office = true
remote_eligibility = "india_office"
last_checked = "2026-11-09"
sources = [
    "https://api.ashbyhq.com/posting-api/job-board/kong",
    "https://jobs.ashbyhq.com/kong",
]

