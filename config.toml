# Personal AI-powered job hunting configuration.
#
# All sources below are PUBLIC job-board feeds exposed by Greenhouse and Lever
# for third-party job boards (no login, no scraping of gated pages). Add or
# remove entries freely. `name` is the display company (used when the source
# does not return one).

[database]
path = "data/jobs.db"

[collect]
min_score = 40        # default highlight threshold for `collect`
list_limit = 20       # max newly discovered jobs shown per collect run

# ---- job sources ----------------------------------------------------------

[[sources]]
type = "greenhouse"
token = "vercel"
name = "Vercel"

