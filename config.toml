[[sources]]
type = "weworkremotely"
token = "remote-devops-sysadmin-jobs"
name = "We Work Remotely: DevOps & Sysadmin"

# YC Work-at-a-Startup job board: comma-separated YC company slugs. Fetches the
# structured job list from each company's official workatastartup.com page.
[[sources]]
type = "yc_waas"
token = "mixrank,zepto,solari-ai,craze,coupl,imt-care,inferedge,neodocs,nino-foods,propreturns,veera-health,kodo,easyplan,pillarplus,godutch,helpnow,taali-inc,algosurg-inc"
name = "YC Work-at-a-Startup (Mumbai + remote)"

# ---- target roles ---------------------------------------------------------
# A role's keywords are matched against the job title (and description where
# the source provides one). Short keywords (<=3 chars) are word-boundary
# matched to avoid false hits ("go", "ai", "ml").

[[roles]]
key = "devops"
label = "Junior DevOps / SRE / Infra"
keywords = [
  "devops", "site reliability", "sre", "infrastructure", "platform engineer",
  "cloud engineer", "systems engineer", "release engineer",
  "production engineer", "observability", "build engineer", "deployment engineer",
]

[[roles]]
key = "cloud"
label = "Cloud Engineering"
keywords = [
  "cloud", "aws", "azure", "gcp", "google cloud", "kubernetes", "k8s",
  "terraform", "serverless", "cloud infrastructure", "cloud platform",
]

[[roles]]
key = "go_backend"
label = "Go Backend Engineering"
keywords = [
  "go", "golang", "backend", "back-end", "backend engineer", "api",
  "microservices", "grpc", "distributed systems", "software engineer",
  "software engineering",
]

[[roles]]
key = "ai_automation"
label = "AI / Automation Engineering"
keywords = [
  "ai", "artificial intelligence", "machine learning", "ml", "llm",
  "large language", "automation", "agent", "agents", "rag", "nlp",
  "ai engineer", "ml engineer", "data engineer", "generative",
]

# ---- target locations (ordered: first match wins) -------------------------

[[locations]]
key = "mumbai"
label = "Mumbai"
keywords = ["mumbai", "maharashtra"]
points = 35

[[locations]]
key = "india"
label = "India"
keywords = [
  "india", "bengaluru", "bangalore", "delhi", "new delhi", "pune",
  "hyderabad", "gurgaon", "gurugram", "chennai", "noida",
]
points = 30

# ---- hard eligibility filter (applied BEFORE scoring) ---------------------

[eligibility]
# On-site/hybrid cities the user will work in (Mumbai metro = default shortlist).
cities = ["mumbai", "thane", "navi mumbai", "new bombay"]
# Other Indian cities go to a separate relocation queue (not the shortlist).
relocation = true

# ---- Firecrawl (optional; credentials stay in the CLI's secure store) ----

[firecrawl]
enabled = true
monthly_budget = 1000
warning_threshold = 650
hard_stop_threshold = 800
absolute_account_limit = 1000
allow_payg = false
search_results_default = 10
db_path = "data/firecrawl.db"

# ---- change/closure tracking ----------------------------------------------

[tracking]
# A role is marked closed only after it is absent from this many successive
# successful scans of its source.
close_after_scans = 2

# ---- companies registry ----------------------------------------------------

[companies]
path = "data/companies.toml"
db = "data/companies.db"

# ---- daily report output ---------------------------------------------------

[report]
dir = "reports"

# ---- scoring weights ------------------------------------------------------

[scoring]
role_max = 40
role_base = 18                 # points once a role keyword hits the title
role_per_title = 4             # per additional distinct title keyword
role_per_desc = 2              # per description-only keyword
location_max = 35
remote_open_points = 15        # "remote", region-unrestricted
remote_restricted_penalty = -15  # "remote" but named to another country
remote_india_bonus = 4         # extra when remote AND India-eligible
seniority_max = 15
internship_max = 10
junior_bonus = 15
senior_penalty = -15
neutral_bonus = 8              # no seniority marker -> junior-eligible
irrelevant_cap = 20            # ceiling for roles with no target match
