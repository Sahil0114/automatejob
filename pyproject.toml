[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "automatejob"
version = "0.1.0"
description = "Personal AI-powered job hunting assistant (reads public Greenhouse/Lever job boards)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["requests>=2.28"]

[project.scripts]
automatejob = "automatejob.cli:main"

[tool.setuptools.packages.find]
include = ["automatejob*"]
